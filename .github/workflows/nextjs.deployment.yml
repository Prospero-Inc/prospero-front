name: Deploy Prospero Frontend

on:
  push:
    branches: ['main']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/prospero-inc/prospero-front

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Install dependencies
        run: |
          npm install -g pnpm@9
          pnpm install

      - name: Lint
        run: pnpm lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NODE_ENV=production
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: self-hosted

    env:
      # Deploy exactly the image built from this commit, never `latest`;
      # docker-compose.yml reads it as ${IMAGE_TAG}.
      IMAGE_TAG: ${{ github.sha }}
      # Passed to the container at runtime by docker-compose.yml, so it is
      # never baked into the image.
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the running image for rollback
        # Tag whatever is running now as :rollback before anything changes.
        # No-op on the very first deploy (no container yet).
        run: |
          RUNNING=$(docker inspect --format '{{.Image}}' prospero-frontend 2>/dev/null || true)
          if [ -n "$RUNNING" ]; then docker tag "$RUNNING" ${{ env.IMAGE }}:rollback; fi

      - name: Pull this commit's image
        run: docker compose pull

      - name: Deploy and wait until healthy
        id: deploy
        # No `down` first: compose recreates the container in place, then waits
        # for docker-compose.yml's healthcheck (GET /api/health).
        run: |
          docker compose up -d
          # Polls the container's healthcheck instead of `compose up --wait`,
          # which needs Compose v2.17+ on the server.
          for i in $(seq 1 24); do
            status=$(docker inspect --format '{{.State.Health.Status}}' prospero-frontend 2>/dev/null || echo missing)
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 5
          done
          echo "::error::prospero-frontend never became healthy (last status: $status)"
          exit 1

      - name: Roll back to the previous image
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "::error::New image failed its health check, rolling back"
          docker logs --tail 100 prospero-frontend || true
          IMAGE_TAG=rollback docker compose up -d
          # Polls the container's healthcheck instead of `compose up --wait`,
          # which needs Compose v2.17+ on the server.
          for i in $(seq 1 24); do
            status=$(docker inspect --format '{{.State.Health.Status}}' prospero-frontend 2>/dev/null || echo missing)
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 5
          done
          echo "::error::prospero-frontend never became healthy (last status: $status)"
          exit 1

      - name: Clean up old images
        # Keep the image just deployed and :rollback; drop older commit tags.
        run: |
          docker images ${{ env.IMAGE }} --format '{{.Tag}} {{.ID}}' \
            | awk -v keep="${{ env.IMAGE_TAG }}" '$1 != keep && $1 != "rollback" && $1 != "latest" {print $2}' \
            | sort -u | xargs -r docker rmi || true
          docker image prune -f
