name: CI

# Runs on every pull request (any base branch): lint, type check, a
# production build and the Playwright mobile smoke tests against it.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Build-time placeholders only; nothing is deployed from this job.
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      NEXTAUTH_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18.16.0

      - name: Install dependencies
        run: |
          npm install -g pnpm@9
          pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      # Playwright needs Node 20+; lint/type check/build above stay on the
      # production Node version until Fase 2 moves everything to 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Mobile smoke tests (iPhone and Pixel viewports)
        run: pnpm test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
